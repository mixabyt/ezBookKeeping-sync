<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<!-- застосунок, а не сторінка: без зуму (iOS ігнорує user-scalable — див. gesturestart нижче) -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ezbk">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ezbk мапінг категорій</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<!-- iOS не бере SVG для домашнього екрана: без PNG ставить скриншот сторінки -->
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #111418; --card: #1a1f26; --line: #2a313b;
    --text: #e6e9ee; --muted: #8b95a3; --accent: #4f8cff;
    --ok: #37b26a; --warn: #d8a236; --err: #e05a5a;
  }
  /* до монтування Vue браузер показав би сирий шаблон з {{ … }} */
  [v-cloak] { display: none; }
  * { box-sizing: border-box; }
  html, body {
    overscroll-behavior: none;       /* без відскоку й pull-to-refresh */
    -webkit-text-size-adjust: 100%;  /* iOS не збільшує шрифт при повороті */
    touch-action: manipulation;      /* без зуму подвійним тапом і затримки тапу */
  }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 0 0 env(safe-area-inset-bottom);
    /* текст інтерфейсу не виділяється, і довгий тап не відкриває системне меню */
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* у полях виділення й вставка потрібні; id рахунку інколи треба скопіювати */
  input, select, textarea, .mono { -webkit-user-select: text; user-select: text; }
  header {
    display: flex; align-items: center; gap: 8px;
    /* статус-бар black-translucent лежить поверх контенту — відступаємо під нього тут,
       а не в body, інакше липкий хедер заїде під годинник */
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    border-bottom: 1px solid var(--line); position: sticky; top: 0;
    background: var(--bg); z-index: 2;
  }
  main.login { padding-top: calc(16px + env(safe-area-inset-top)); }
  header h1 { font-size: 16px; margin: 0 6px 0 0; font-weight: 600; }
  .tabs { display: flex; gap: 6px; flex: 1; }
  main { padding: 16px; max-width: 760px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .card.off { opacity: .6; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input, select, button {
    /* 16px: з меншим шрифтом iOS зумить сторінку при фокусі на полі й не повертає масштаб */
    font: inherit; font-size: 16px; width: 100%; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: #141921; color: var(--text);
  }
  input[type=checkbox] { width: auto; padding: 0; margin: 0; accent-color: var(--accent); }
  label.check { display: inline-flex; align-items: center; gap: 8px; margin: 0; color: var(--text); font-size: 14px; cursor: pointer; }
  button { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  /* підсвітку тапу прибрали — відгук на натискання даємо самі */
  button:active:not(:disabled) { opacity: .75; }
  button.icon { font-size: 18px; line-height: 1; padding: 6px 10px; }
  button.ghost { background: transparent; border-color: var(--line); color: var(--muted); font-weight: 500; width: auto; padding: 7px 12px; }
  button.ghost.active { color: var(--text); border-color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; min-width: 0; }
  .row > button { flex: 0 0 auto; width: auto; padding: 11px 18px; }
  .spread { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .key { font-size: 18px; font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.expense { color: var(--err); border-color: #43272b; }
  .badge.income { color: var(--ok); border-color: #22402f; }
  .badge.done { color: var(--ok); border-color: #22402f; }
  .badge.wait { color: var(--warn); border-color: #4a3a1c; }
  .msg { padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; font-size: 14px; }
  .msg.err { background: #2b1a1c; color: #ffb4b4; }
  .msg.ok { background: #16271d; color: #9ae6b8; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .missing { color: var(--warn); }
  a { color: var(--accent); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 10px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; word-break: break-all; }
  .picker { position: relative; }
  .picker ul {
    position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px);
    margin: 0; padding: 4px; list-style: none; max-height: 260px; overflow-y: auto;
    background: #141921; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
  }
  .picker li { padding: 9px 10px; border-radius: 8px; cursor: pointer; }
  .picker li.active { background: #1f2733; }
  /* на сенсорному екрані :hover «залипає» на останньому тапнутому пункті */
  @media (hover: hover) { .picker li:hover { background: #1f2733; } }
  .picker li .parent { color: var(--muted); font-size: 12px; display: block; }
  .picker li.none { color: var(--muted); cursor: default; }
</style>
</head>
<body>
<div id="app" v-cloak>

  <!-- authed === null: ще перевіряємо сесію — нічого не показуємо, щоб логін не блимав -->

  <!-- екран входу -->
  <main v-if="authed === false" class="login">
    <div class="card" style="margin-top:12vh">
      <h1 style="margin:0 0 14px;font-size:18px">ezbk мапінг</h1>
      <div v-if="error" class="msg err">{{ error }}</div>
      <label>Логін</label>
      <input v-model="loginForm.login" autocomplete="username" @keyup.enter="doLogin">
      <div style="height:10px"></div>
      <label>Пароль</label>
      <input v-model="loginForm.password" type="password" autocomplete="current-password" @keyup.enter="doLogin">
      <div style="height:14px"></div>
      <button :disabled="busy" @click="doLogin">{{ busy ? 'Входимо…' : 'Увійти' }}</button>
    </div>
  </main>

  <!-- робочий екран -->
  <template v-else-if="authed">
    <header>
      <h1>ezbk</h1>
      <nav class="tabs">
        <button class="ghost" :class="{ active: view === 'pending' }" @click="go('pending')">Чекають</button>
        <button class="ghost" :class="{ active: view === 'mappings' }" @click="go('mappings')">Мапінги</button>
      </nav>
      <button class="ghost icon" :disabled="refreshing || loading" @click="manualRefresh" aria-label="Оновити">⟳</button>
      <button class="ghost" @click="doLogout">Вийти</button>
    </header>
    <main>
      <div v-if="error" class="msg err">{{ error }}</div>
      <div v-if="notice" class="msg ok">{{ notice }}</div>

      <!-- ============ Чекають ============ -->
      <template v-if="view === 'pending'">
        <div class="spread" style="margin-bottom:4px">
          <span class="muted">{{ onlyPending ? 'Лише те, що ще не замаплено' : 'Усі ключі, разом із замапленими' }}</span>
          <button class="ghost" @click="toggleAll">{{ onlyPending ? 'Показати всі' : 'Тільки борг' }}</button>
        </div>

        <div v-if="loading" class="empty">Завантаження…</div>
        <div v-else-if="!error && !keys.length && !waitingAccounts.length" class="empty">
          Усе замаплено 🎉<br><span class="muted">Нові ключі й рахунки зʼявляться тут після транзакцій без мапінгу</span>
        </div>

        <template v-if="!loading">
          <!-- рахунки: без мапінгу джоба не піде в ezBookkeeping навіть з категорією -->
          <template v-if="waitingAccounts.length">
            <h2>Рахунки</h2>
            <div v-for="acc in waitingAccounts" :key="accId(acc)" class="card">
              <div class="spread">
                <span class="mono">{{ acc.bank_account_id }}</span>
                <span class="badge wait">{{ acc.waiting_jobs }} {{ pluralTx(acc.waiting_jobs) }} {{ waits(acc.waiting_jobs) }}</span>
              </div>
              <div class="meta">{{ acc.source }} · напр. «{{ acc.sample_desc || '—' }}»</div>
              <select v-model="accountSelection[accId(acc)]">
                <option value="">— оберіть рахунок ezBookkeeping —</option>
                <option v-for="a in ezAccounts" :key="a.id" :value="a.id">{{ accountLabel(a) }}</option>
              </select>
              <div style="height:8px"></div>
              <div class="row">
                <input v-model="accountNames[accId(acc)]" placeholder="Назва для себе, напр. «Чорна UAH»">
                <button :disabled="!accountSelection[accId(acc)] || saving === accId(acc)" @click="saveAccount(acc)">
                  {{ saving === accId(acc) ? '…' : 'Зберегти' }}
                </button>
              </div>
            </div>
          </template>

          <h2 v-if="keys.length">Категорії (MCC)</h2>

          <div v-for="key in keys" :key="rowId(key)" class="card">
            <div class="spread">
              <span class="key">{{ key.key }}</span>
              <span>
                <span v-if="key.waiting_jobs" class="badge wait" style="margin-right:6px">{{ key.waiting_jobs }} {{ waits(key.waiting_jobs) }}</span>
                <span class="badge" :class="key.direction">{{ dirLabel(key.direction) }}</span>
                <span v-if="key.resolved" class="badge done" style="margin-left:6px">замаплено</span>
              </span>
            </div>
            <div class="meta">
              {{ key.sample_desc || '—' }} · {{ key.hits }} {{ plural(key.hits) }} · {{ key.key_type }}
            </div>

            <div v-if="key.key_type !== 'mcc'" class="muted">
              Банківські категорії мапляться в таблиці bank_category_mcc — через цей екран поки не редагуються.
            </div>
            <!-- для замапленого ключа повторне створення дасть 409 — редагування живе в «Мапінгах» -->
            <div v-else-if="key.resolved" class="muted">
              Правило вже є — змінити можна в <a href="#/mappings" @click.prevent="go('mappings', key.key)">Мапінгах</a>.
            </div>
            <div v-else class="row">
              <category-picker :options="categoriesFor(key.direction)" v-model="selection[rowId(key)]"></category-picker>
              <button :disabled="!selection[rowId(key)] || saving === rowId(key)" @click="saveRule(key)">
                {{ saving === rowId(key) ? '…' : 'Зберегти' }}
              </button>
            </div>
          </div>
        </template>
      </template>

      <!-- ============ Мапінги ============ -->
      <template v-else>
        <div class="muted" style="margin-bottom:4px">
          Зміни діють на нові транзакції й ті, що чекають. Уже записані в ezBookkeeping не переписуються.
        </div>

        <div v-if="loading" class="empty">Завантаження…</div>
        <template v-else>
          <h2>Рахунки</h2>
          <div v-if="!accountMappings.length" class="muted">Мапінгів рахунків ще немає.</div>
          <div v-for="m in accountMappings" :key="accId(m)" class="card">
            <div class="spread">
              <span class="mono">{{ m.bank_account_id }}</span>
              <span class="badge">{{ m.source }}</span>
            </div>
            <div class="meta">
              Зараз: <span :class="{ missing: !accountById(m.ezb_account_id) }">{{ accountName(m.ezb_account_id) }}</span>
            </div>
            <select v-model="accEdits[accId(m)].ezb">
              <!-- рахунок могли сховати чи видалити в ezBookkeeping — не підміняємо його мовчки першим зі списку -->
              <option v-if="!accountById(m.ezb_account_id)" :value="m.ezb_account_id" disabled>{{ accountName(m.ezb_account_id) }}</option>
              <option v-for="a in ezAccounts" :key="a.id" :value="a.id">{{ accountLabel(a) }}</option>
            </select>
            <div style="height:8px"></div>
            <div class="row">
              <input v-model="accEdits[accId(m)].name" placeholder="Назва для себе">
              <button :disabled="!accDirty(m) || saving === accId(m)" @click="updateAccount(m)">
                {{ saving === accId(m) ? '…' : 'Зберегти' }}
              </button>
            </div>
          </div>

          <h2>Правила MCC</h2>
          <input v-if="rules.length" v-model="ruleQuery" type="search" placeholder="Пошук: MCC, категорія або нотатка" style="margin-bottom:12px">
          <div v-if="!rules.length" class="muted">Правил ще немає — створіть їх на вкладці «Чекають».</div>
          <div v-else-if="!filteredRules.length" class="muted">Нічого не знайдено.</div>

          <div v-for="rule in filteredRules" :key="rule.id" class="card" :class="{ off: !ruleEdits[rule.id].enabled }">
            <div class="spread">
              <span class="key">{{ mccRange(rule) }}</span>
              <span class="badge" :class="rule.direction">{{ dirLabel(rule.direction) }}</span>
            </div>
            <div class="meta">
              <span :class="{ missing: !categoryById(rule.ezb_category_id) }">{{ categoryName(rule.ezb_category_id) }}</span>
              <template v-if="rule.note"> · {{ rule.note }}</template>
            </div>
            <category-picker :options="categoriesFor(rule.direction)" v-model="ruleEdits[rule.id].category"
                             :current-label="categoryName(ruleEdits[rule.id].category)"></category-picker>
            <div style="height:10px"></div>
            <div class="spread">
              <label class="check"><input type="checkbox" v-model="ruleEdits[rule.id].enabled"> увімкнено</label>
              <button style="width:auto;padding:9px 18px" :disabled="!ruleDirty(rule) || saving === 'rule:' + rule.id" @click="updateRule(rule)">
                {{ saving === 'rule:' + rule.id ? '…' : 'Зберегти' }}
              </button>
            </div>
          </div>
        </template>
      </template>
    </main>
  </template>
</div>

<script src="vue.global.prod.js"></script>
<script>
const { createApp, reactive, ref, computed, onMounted } = Vue;

const catLabel = (o) => (o.parent_name ? o.parent_name + ' / ' + o.name : o.name);

// Пошукове поле зі списком: швидше, ніж гортати 42 витратні категорії в select.
// Пошук за всіма словами в будь-якому порядку по "Батьківська / Назва":
// "тран так" знайде "Транспорт / Таксі та оренда авто".
// Значення змінюється лише вибором зі списку; набраний, але не обраний текст
// на blur повертається до підпису поточного значення.
const CategoryPicker = {
  props: {
    options: { type: Array, default: () => [] },
    modelValue: { type: String, default: '' },
    // підпис для значення, якого немає в options (приховане чи видалене в ezBookkeeping)
    currentLabel: { type: String, default: '' },
  },
  emits: ['update:modelValue'],
  data: () => ({ query: '', open: false, focused: false, active: 0 }),
  computed: {
    filtered() {
      const words = this.query.toLowerCase().split(/\s+/).filter(Boolean);
      return this.options
        .filter((o) => {
          const text = catLabel(o).toLowerCase();
          return words.every((w) => text.includes(w));
        })
        .slice(0, 30);
    },
  },
  watch: {
    // значення змінив батько (скинув після збереження, довідник довантажився) —
    // показуємо його, але не чіпаємо поле, поки людина в ньому друкує
    modelValue() { if (!this.focused) this.sync(); },
    options() { if (!this.focused) this.sync(); },
    query() { this.active = 0; },
  },
  mounted() { this.sync(); },
  methods: {
    sync() {
      const current = this.options.find((o) => o.id === this.modelValue);
      this.query = current ? catLabel(current) : (this.modelValue ? this.currentLabel : '');
    },
    onFocus(event) {
      this.focused = true;
      this.open = true;
      // виділяємо поточний підпис, щоб одразу друкувати пошук поверх нього
      event.target.select();
    },
    onBlur() {
      this.focused = false;
      this.open = false;
      this.sync();
    },
    pick(option) {
      this.open = false;
      this.$emit('update:modelValue', option.id);
      this.query = catLabel(option);
    },
    onKey(event) {
      if (event.key === 'ArrowDown') { this.open = true; this.active = Math.min(this.active + 1, this.filtered.length - 1); event.preventDefault(); }
      else if (event.key === 'ArrowUp') { this.active = Math.max(this.active - 1, 0); event.preventDefault(); }
      else if (event.key === 'Enter' && this.open && this.filtered[this.active]) { this.pick(this.filtered[this.active]); event.preventDefault(); }
      else if (event.key === 'Escape') { this.open = false; this.sync(); }
    },
  },
  template: `
    <div class="picker">
      <input v-model="query" @input="open = true" @focus="onFocus" @blur="onBlur" @keydown="onKey"
             placeholder="Пошук категорії…" autocomplete="off" enterkeyhint="done">
      <ul v-if="open">
        <!-- mousedown.prevent: інакше blur закриє список раніше, ніж спрацює клік -->
        <li v-for="(o, i) in filtered" :key="o.id" :class="{ active: i === active }"
            @mousedown.prevent="pick(o)">
          <span v-if="o.parent_name" class="parent">{{ o.parent_name }}</span>{{ o.name }}
        </li>
        <li v-if="!filtered.length" class="none">Нічого не знайдено</li>
      </ul>
    </div>`,
};

const app = createApp({
  setup() {
    // null — ще не знаємо, чи є сесія; false — показуємо логін; true — робочий екран
    const authed = ref(null);
    const busy = ref(false);
    const loading = ref(true);
    const saving = ref('');
    const error = ref('');
    const notice = ref('');
    const view = ref('pending');
    const onlyPending = ref(true);
    const loginForm = reactive({ login: '', password: '' });

    // довідники ezBookkeeping: спільні для обох вкладок, вантажимо раз за сесію
    const allCategories = ref([]); // разом із прихованими — для підписів уже збережених правил
    const ezAccounts = ref([]);

    // «Чекають»
    const keys = ref([]);
    const selection = reactive({});
    const waitingAccounts = ref([]);
    const accountSelection = reactive({});
    const accountNames = reactive({});

    // «Мапінги»
    const rules = ref([]);
    const ruleEdits = reactive({});
    const ruleQuery = ref('');
    const accountMappings = ref([]);
    const accEdits = reactive({});

    const clear = (obj) => Object.keys(obj).forEach((k) => delete obj[k]);

    // після виходу чи протухлої сесії не лишаємо чужих даних на екрані
    function resetData() {
      allCategories.value = [];
      ezAccounts.value = [];
      keys.value = [];
      waitingAccounts.value = [];
      rules.value = [];
      accountMappings.value = [];
      [selection, accountSelection, accountNames, ruleEdits, accEdits].forEach(clear);
      notice.value = '';
    }

    // Шляхи навмисно без початкового "/": застосунок може жити під префіксом
    // (wallet.coffeebeans.space/ezbk/), і "api/me" тоді піде на /ezbk/api/me,
    // а "/api/me" — у корінь домену, тобто в API самого ezBookkeeping.
    // один вхід для всіх запитів: 401 означає, що сесія закінчилась
    async function api(path, options = {}) {
      const res = await fetch(path, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
      });
      const body = await res.json().catch(() => null);
      if (res.status === 401) {
        // 401 на сам логін — це неправильний пароль, а не протухла сесія
        if (path === 'api/login') throw new Error('Неправильний логін або пароль');
        const wasAuthed = authed.value;
        authed.value = false;
        resetData();
        throw new Error(wasAuthed ? 'Сесія завершилась, увійдіть ще раз' : '');
      }
      if (!res.ok) throw new Error(body?.error?.message || `Помилка ${res.status}`);
      return body?.data;
    }

    const rowId = (key) => `${key.key_type}:${key.key}:${key.direction}`;
    const accId = (acc) => `${acc.source}/${acc.bank_account_id}`;
    const dirLabel = (d) => (d === 'income' ? 'дохід' : 'витрата');
    const mccRange = (r) => (r.mcc_from === r.mcc_to ? String(r.mcc_from) : `${r.mcc_from}–${r.mcc_to}`);
    // 1 раз / 2 рази / 5 разів
    const pluralForm = (n, one, few, many) => {
      const d = n % 10, h = n % 100;
      if (d === 1 && h !== 11) return one;
      if (d >= 2 && d <= 4 && (h < 12 || h > 14)) return few;
      return many;
    };
    const plural = (n) => pluralForm(n, 'раз', 'рази', 'разів');
    const pluralTx = (n) => pluralForm(n, 'транзакція', 'транзакції', 'транзакцій');
    // "1 транзакція чекає", але "2 транзакції чекають"
    const waits = (n) => (n % 10 === 1 && n % 100 !== 11 ? 'чекає' : 'чекають');
    // queued — скільки джоб перевіриться повторно; реально рушать лише ті,
    // для яких є і категорія, і рахунок — тому формулювання обережне
    const checks = (n) => (n % 10 === 1 && n % 100 !== 11 ? 'перевіряється' : 'перевіряються');
    const queuedNote = (n) => (n ? `, ${n} ${pluralTx(n)} ${checks(n)} повторно` : '');

    // у picker пропонуємо лише видимі категорії, а підписи шукаємо серед усіх
    const categoriesFor = (direction) =>
      allCategories.value.filter((c) => !c.hidden && c.kind === (direction === 'income' ? 'income' : 'expense'));
    const categoryById = (id) => allCategories.value.find((c) => c.id === id);
    const categoryName = (id) => {
      const c = categoryById(id);
      return c ? catLabel(c) + (c.hidden ? ' (прихована)' : '') : `#${id} — немає в ezBookkeeping`;
    };
    const accountLabel = (a) => `${a.parent_name ? a.parent_name + ' / ' + a.name : a.name} (${a.currency})`;
    const accountById = (id) => ezAccounts.value.find((a) => a.id === id);
    const accountName = (id) => {
      const a = accountById(id);
      return a ? accountLabel(a) : `#${id} — немає в ezBookkeeping`;
    };

    const filteredRules = computed(() => {
      const words = ruleQuery.value.toLowerCase().split(/\s+/).filter(Boolean);
      if (!words.length) return rules.value;
      return rules.value.filter((r) => {
        const text = `${mccRange(r)} ${categoryName(r.ezb_category_id)} ${r.note} ${dirLabel(r.direction)}`.toLowerCase();
        return words.every((w) => text.includes(w));
      });
    });
    const ruleDirty = (r) => {
      const e = ruleEdits[r.id];
      return e && (e.category !== r.ezb_category_id || e.enabled !== r.enabled);
    };
    const accDirty = (m) => {
      const e = accEdits[accId(m)];
      return e && (e.ezb !== m.ezb_account_id || e.name !== m.name);
    };

    async function loadCatalogs() {
      const [cats, accs] = await Promise.all([
        allCategories.value.length ? null : api('api/categories?include_hidden=true'),
        ezAccounts.value.length ? null : api('api/accounts'),
      ]);
      if (cats) allCategories.value = cats.items;
      if (accs) ezAccounts.value = accs.items;
    }

    async function loadPending() {
      const [unmapped, waitingAcc] = await Promise.all([
        api(`api/unmapped?only_pending=${onlyPending.value}`),
        api('api/unmapped-accounts'),
        loadCatalogs(),
      ]);
      keys.value = unmapped.items;
      waitingAccounts.value = waitingAcc.items;
    }

    async function loadMappings() {
      const [rulesRes, mappingsRes] = await Promise.all([
        api('api/rules'),
        api('api/account-mappings'),
        loadCatalogs(),
      ]);
      clear(ruleEdits);
      rulesRes.items.forEach((r) => { ruleEdits[r.id] = { category: r.ezb_category_id, enabled: r.enabled }; });
      clear(accEdits);
      mappingsRes.items.forEach((m) => { accEdits[accId(m)] = { ezb: m.ezb_account_id, name: m.name }; });
      rules.value = rulesRes.items;
      accountMappings.value = mappingsRes.items;
    }

    // keepNotice: після збереження перезавантажуємо список, а повідомлення лишаємо
    async function load({ keepNotice = false } = {}) {
      loading.value = true;
      error.value = '';
      if (!keepNotice) notice.value = '';
      try {
        await (view.value === 'mappings' ? loadMappings() : loadPending());
      } catch (e) {
        error.value = e.message;
      } finally {
        loading.value = false;
      }
    }

    // Тихе оновлення «Чекають»: нові транзакції зʼявляються самі, без перезапуску.
    // Без loading = true: інакше список на мить зміниться на «Завантаження…» і
    // відкритий picker розмонтується разом із набраним текстом. Картки в v-for з
    // ключами, тож вибір і набраний текст у наявних лишаються на місці.
    const refreshing = ref(false);
    let refreshError = false; // помилку саме оновлення прибираємо при наступному успіху, чужу — ні
    async function refresh() {
      if (!authed.value || view.value !== 'pending' || saving.value || loading.value || refreshing.value) return;
      refreshing.value = true;
      try {
        await loadPending();
        if (refreshError) error.value = '';
        refreshError = false;
      } catch (e) {
        if (authed.value) { error.value = e.message; refreshError = true; }
      } finally {
        refreshing.value = false;
      }
    }

    // на «Мапінгах» — повне перезавантаження: там незбережені правки скидаються свідомо, по кнопці
    const manualRefresh = () => (view.value === 'pending' ? refresh() : load());

    // «Мапінги» самі не змінюються, а їх перезавантаження скинуло б незбережені правки,
    // тому опитуємо лише «Чекають» і лише коли застосунок на екрані
    const POLL_MS = 15000;
    setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, POLL_MS);
    // повернулись у застосунок з фону — не чекаємо таймера
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') refresh();
    });

    // вкладка живе в hash: перезавантаження лишає на тому ж екрані,
    // і під префіксом /ezbk/ серверу нічого знати не треба
    const viewFromHash = () => (location.hash.startsWith('#/mappings') ? 'mappings' : 'pending');
    function go(name, search = '') {
      ruleQuery.value = search;
      location.hash = name === 'mappings' ? '#/mappings' : '#/';
    }
    window.addEventListener('hashchange', () => {
      const next = viewFromHash();
      if (next === view.value) return;
      view.value = next;
      if (authed.value) load();
    });

    async function doLogin() {
      // інакше сервер відповість сирим текстом валідатора англійською
      if (!loginForm.login.trim() || !loginForm.password) {
        error.value = 'Введіть логін і пароль';
        return;
      }
      busy.value = true;
      error.value = '';
      try {
        await api('api/login', { method: 'POST', body: JSON.stringify(loginForm) });
        loginForm.password = '';
        authed.value = true;
        await load();
      } catch (e) {
        error.value = e.message;
      } finally {
        busy.value = false;
      }
    }

    async function doLogout() {
      try { await api('api/logout', { method: 'POST' }); } catch (e) { /* вже вийшли */ }
      authed.value = false;
      error.value = '';
      resetData();
    }

    // спільна обгортка для кнопок «Зберегти»
    async function save(id, action) {
      saving.value = id;
      error.value = '';
      notice.value = '';
      try {
        notice.value = await action();
        await load({ keepNotice: true });
      } catch (e) {
        error.value = e.message;
      } finally {
        saving.value = '';
      }
    }

    const saveRule = (key) => save(rowId(key), async () => {
      const created = await api('api/rules', {
        method: 'POST',
        body: JSON.stringify({
          mcc_from: Number(key.key),
          direction: key.direction,
          ezb_category_id: selection[rowId(key)],
          note: key.sample_desc,
        }),
      });
      delete selection[rowId(key)];
      return `MCC ${key.key} замаплено${queuedNote(created.queued)}`;
    });

    const saveAccount = (acc) => save(accId(acc), async () => {
      const id = accId(acc);
      const created = await api('api/account-mappings', {
        method: 'POST',
        body: JSON.stringify({
          source: acc.source,
          bank_account_id: acc.bank_account_id,
          ezb_account_id: accountSelection[id],
          name: accountNames[id] || '',
        }),
      });
      delete accountSelection[id];
      delete accountNames[id];
      return `Рахунок замаплено${queuedNote(created.queued)}`;
    });

    const updateRule = (rule) => save('rule:' + rule.id, async () => {
      const edit = ruleEdits[rule.id];
      const res = await api(`api/rules/${rule.id}`, {
        method: 'PUT',
        body: JSON.stringify({ ezb_category_id: edit.category, enabled: edit.enabled, note: rule.note }),
      });
      const name = `MCC ${mccRange(rule)}`;
      return res.rule.enabled
        ? `${name} збережено${queuedNote(res.queued)}`
        : `${name} вимкнено — нові транзакції з цим MCC зʼявлятимуться в «Чекають»`;
    });

    const updateAccount = (m) => save(accId(m), async () => {
      const edit = accEdits[accId(m)];
      const res = await api('api/account-mappings', {
        method: 'POST',
        body: JSON.stringify({
          source: m.source,
          bank_account_id: m.bank_account_id,
          ezb_account_id: edit.ezb,
          name: edit.name,
        }),
      });
      return `Рахунок ${edit.name || m.bank_account_id} збережено${queuedNote(res.queued)}`;
    });

    function toggleAll() {
      onlyPending.value = !onlyPending.value;
      load();
    }

    // сесія в HttpOnly-кукі: перевіряємо її наявність через /api/me
    onMounted(async () => {
      view.value = viewFromHash();
      try {
        await api('api/me');
        authed.value = true;
        await load();
      } catch (e) {
        // 401 уже перевів на логін; інакше сервер недоступний — кажемо про це там же
        authed.value = false;
        error.value = e.message;
      }
    });

    return { authed, busy, loading, saving, refreshing, manualRefresh, error, notice, view, onlyPending, loginForm,
             keys, selection, waitingAccounts, ezAccounts, accountSelection, accountNames,
             rules, ruleEdits, ruleQuery, filteredRules, accountMappings, accEdits,
             go, doLogin, doLogout, saveRule, saveAccount, updateRule, updateAccount, toggleAll,
             rowId, accId, dirLabel, mccRange, plural, pluralTx, waits, categoriesFor,
             categoryById, categoryName, accountLabel, accountById, accountName, ruleDirty, accDirty };
  },
});
app.component('category-picker', CategoryPicker);
app.mount('#app');

// iOS Safari ігнорує user-scalable=no (заради доступності), тож pinch-zoom гасимо подією
document.addEventListener('gesturestart', (e) => e.preventDefault());

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
